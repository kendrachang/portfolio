<style>
  :root {
    --paper: #F7F5F1;
    --paper-dim: #EFEBE3;
    --ink: #20211F;
    --ink-soft: #55564F;
    --steel: #3D5A73;
    --steel-dim: #7C93A3;
    --line: #D9D4C9;
    --amber: #B5651D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  a { color: var(--steel); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--steel);
    outline-offset: 3px;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 32px;
  }

  @media (max-width: 640px) {
    .wrap { padding: 0 22px; }
    body { font-size: 16px; }
  }

  /* ---------- Header ---------- */

  header {
    padding: 28px 0;
    border-bottom: 1px solid var(--line);
  }

  header .wrap {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 18px;
  }

  header nav a {
    color: var(--ink-soft);
    margin-left: 28px;
    font-size: 15px;
  }

  header nav a:hover { color: var(--steel); }
  header nav a.current { color: var(--ink); }

  @media (max-width: 640px) {
    header nav a { margin-left: 16px; font-size: 14px; }
  }

  /* ---------- Page head ---------- */

  .page-head {
    padding: 72px 0 56px;
  }

  .page-head h1 {
    font-size: clamp(34px, 5vw, 46px);
    line-height: 1.1;
  }

  /* ---------- Research entry ---------- */

  section.block {
    padding: 0 0 64px;
  }

  .section-head {
    margin-bottom: 36px;
  }

  .section-head h2 {
    font-size: 24px;
  }

  .research-entry {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 8px 0 40px;
    border-bottom: 1px solid var(--line);
  }

  .research-entry figure img {
    max-width: 420px;
  }

  .research-entry figure { margin: 0; }

  .research-entry img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid var(--line);
    background: var(--paper-dim);
  }

  .research-entry figcaption {
    margin-top: 10px;
    font-size: 16px;
    color: var(--ink-soft);
  }

  .research-entry h3 {
    font-size: 22px;
    margin-bottom: 6px;
  }

  .research-entry .lab-meta {
    font-size: 15px;
    color: var(--steel);
    font-weight: 500;
    margin-bottom: 14px;
  }

  .research-entry p {
    color: var(--ink-soft);
    max-width: 46ch;
  }

  footer {
    padding: 28px 0 48px;
    font-size: 13px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
  }
